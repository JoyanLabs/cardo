name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Before opening: run `cardo doctor` and include its output, it answers most questions.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected, what you got.
      placeholder: |
        cardo up vllm-qwen
        expected: engine answers on /v1/models
        got: rolled back to the previous engine
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `cardo doctor`
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: cardo version
      description: Output of `cardo --version`
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and architecture
      placeholder: linux/arm64
    validations:
      required: true
