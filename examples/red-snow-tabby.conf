# TabbyAPI on the vcruz305 exllamav3 fork serving the RED-SNOW 5.3 FLASH
# EXL3 2.49bpw pack (~97 GiB). Swapped in place of the default engine when
# the security/red-team vertical is needed; never resident together with it
# on one GPU.
NAME="red-snow-tabby"
DESCRIPTION="RED-SNOW 5.3 FLASH EXL3 2.49bpw via TabbyAPI (command)"
TYPE="command"
# START must stay in the foreground: cardo owns the process lifetime.
START="/srv/dgx/recipes/red-snow-exl3/serve.sh"
HEALTH="http://127.0.0.1:8908/health"
# Opt-in endpoint in TabbyAPI main; counts live generation jobs.
BUSY="http://127.0.0.1:8908/metrics#generations_active"
# First load maps ~97 GiB from page cache into device memory; allow it.
WAIT="300"
DRAIN="0"
SLOT="0"
